[package]
name = "pmc_core"
version = "0.1.0"
edition = "2021"
authors = ["Harsh Manjramkar <harshmanjramkar@users.noreply.github.com>"]
description = "Mathematically verified core reconciliation and anomaly detection kernel for PMC procurement."

[dependencies]
# Zero runtime allocations where possible, zero unsafe code
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
