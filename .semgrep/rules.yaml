rules:
  - id: avoid-eval-and-dynamic-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: "Dynamic code execution via eval/exec is prohibited by Article III of Constitution."
    languages: [python, javascript, typescript]
    severity: ERROR

  - id: no-hardcoded-api-secrets
    patterns:
      - pattern-regex: "(?i)(api_key|secret|password|bearer|auth_token)\\s*=\\s*['\"][A-Za-z0-9_\\-]{16,}['\"]"
    message: "Hardcoded API secrets or tokens violate Article III of Constitution."
    languages: [python, javascript, typescript]
    severity: ERROR
